[workspace]
resolver = "2"
members = ["crates/surfaces", "crates/surfaces-bake", "xtask"]

# The gate runner is a host tool, not a product crate. Keeping it out of
# `default-members` means a bare `cargo build` / `cargo check` at the root
# still operates on shipped packages only.
default-members = ["crates/surfaces", "crates/surfaces-bake"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94.0"
authors = ["Steven Giacomelli <steve@giacomelli.ca>"]

# Host-tool dependencies for `xtask` only. Shipped crates use nothing from
# this table; `[workspace.dependencies]` is not a shared product graph.
[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
proc-macro2 = "1.0.107"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
syn = { version = "3.0.3", features = ["full", "visit"] }
time = { version = "0.3.55", features = ["macros", "parsing"] }
toml = "1.1.4"
walkdir = "2.5.0"
# Host gate only. The runtime crate must not name this package.
ph-surfaces-bake = { path = "crates/surfaces-bake", version = "0.1.0" }
