# cargo-deny policy for ph-surfaces.
#
# Run with `cargo xtask ci`, or directly:
#   cargo deny check
#
# The shipped graph is two packages. `ph-surfaces` (runtime) has an empty
# `[dependencies]` table. `ph-surfaces-bake` (host baker) may take reviewed
# host crates for exact arithmetic the firmware must not do; those crates
# stay off the runtime graph. This file is a
# ratchet: it fails as soon as an undiscussed crate, licence, or source appears.
# `ph-curves` is banned by name so it cannot return as a direct, transitive,
# optional, path, or Git dependency. Do not add `{ name = "ph-surfaces-bake" }`
# to `[bans] deny`: that would deny the baker package itself. The baker stays
# in this graph so its host dependencies are reviewed. Host-only `xtask`
# dependencies live in `[workspace.dependencies]` and are excluded from this
# graph; `publish_lock` classifies that member instead.

[graph]
all-features = true
exclude = ["xtask"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["MIT"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
deny = [
    { name = "ph-curves" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
