[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Repository automation for the canonical ph-surfaces verification gate"
publish = false

# Host tooling may use std and allocation. It is isolated from the shipped
# crate by workspace membership and `publish_lock`, not by a second lockfile.
[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
hex.workspace = true
proc-macro2.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
syn.workspace = true
time.workspace = true
toml.workspace = true
walkdir.workspace = true
