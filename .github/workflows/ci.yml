# This is a bounded subset of the local gate: least privilege, a job timeout,
# cancellation of superseded runs, SHA-pinned actions, and one job as the
# single aggregate status. It runs the host checks, package build and
# downstream consumer, code-size snapshot, guard self-test, and the two
# pinned-toolchain embedded builds. It still SKIPs (never passes) `deny` and
# the nightly `-Z build-std=core` core-only proofs. The workflow is proven by
# hosted CI running `cargo xtask ci`, not by a separate workflow linter.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo xtask ci (hosted subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy, llvm-tools-preview
          targets: thumbv7em-none-eabi, riscv32imac-unknown-none-elf
      # Cold builds plus the package/consumer matrix and eight code-size
      # builds sit uncomfortably close to the job timeout; the cache is not
      # part of the evidence, only of the wall clock.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            tools/xtask
      - name: Run the canonical gate
        run: cargo xtask ci
