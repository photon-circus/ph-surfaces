# Known gap: GitHub-hosted Actions fail on this private repository before
# any step runs. Do not restore `pull_request` / `push` triggers until the
# repository is public. Local `cargo xtask ci` is the verification entry
# point and remains authoritative.
#
# `workflow_dispatch` is kept so the subset job can be turned on by hand
# after the repo is public, or to confirm the gap. A failed manual run is
# not a local-CI failure.
#
# This is a bounded subset of the local gate: least privilege, a job timeout,
# cancellation of superseded runs, SHA-pinned actions, and one job as the
# single aggregate status. It runs the host checks, package build and
# downstream consumer, code-size snapshot, guard self-test, and the two
# pinned-toolchain embedded builds. It still SKIPs (never passes) `deny`, the
# nightly `-Z build-std=core` core-only proofs, `actionlint`, and the GitHub
# metadata check.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo xtask ci (hosted subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy, llvm-tools-preview
          targets: thumbv7em-none-eabi, riscv32imac-unknown-none-elf
      - name: Run the canonical gate
        run: cargo xtask ci
