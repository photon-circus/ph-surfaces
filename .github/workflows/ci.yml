# Known gap: GitHub-hosted Actions fail on this private repository before
# any step runs. Do not restore `pull_request` / `push` triggers until the
# repository is public. Local `./scripts/ci.sh` is the verification entry
# point and remains authoritative.
#
# `workflow_dispatch` is kept so the subset job can be turned on by hand
# after the repo is public, or to confirm the gap. A failed manual run is
# not a local-CI failure.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: scripts/ci.sh (hosted subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - name: Run canonical CI script
        run: ./scripts/ci.sh
